<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pixvael</title>
  <style>
    body {
      width: 264px;
      margin: 0;
      padding: 14px;
      background: #050711;
      color: #e8f0e8;
      font: 13px/1.55 system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #33ff33;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 0 8px;
      color: #9fb0a4;
    }
    strong {
      color: #e8f0e8;
    }
    a.button {
      display: block;
      margin-top: 12px;
      padding: 9px 10px;
      background: #33ff33;
      color: #050711;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
    }
    a.button:hover {
      background: #66ff66;
    }
  </style>
</head>
<body>
  <h1>Image to Pixel Art</h1>
  <p>Right-click any image on any website and choose <strong>Convert to Pixel Art with Pixvael</strong>.</p>
  <p>The image opens in pixvael.com, ready to convert — free, private, nothing is uploaded.</p>
  <a
    class="button"
    href="https://pixvael.com/?utm_source=chrome-extension-popup"
    target="_blank"
    rel="noopener"
  >Open pixvael.com</a>
</body>
</html>
